<!-- Matte Pink + White Upward Confetti -->
<canvas id="pinkConfettiBg"></canvas>

<script>
(() => {
    const canvas = document.getElementById("pinkConfettiBg");
    const ctx = canvas.getContext("2d");

    let w, h;
    let confetti = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize", resize);

    // VERY visible white/pink colors
    const colors = [
        "#ffffff",
        "#fff7fb",
        "#ffeef7",
        "#ffd9ec",
        "#ffc2e1"
    ];

    class Piece {
        constructor() {
            this.reset(true);
        }

        reset(first = false) {
            this.x = Math.random() * w;
            this.y = first ? Math.random() * h : h + 20;

            this.size = Math.random() * 10 + 6;

            this.vx = (Math.random() - 0.5) * 2;
            this.vy = Math.random() * 3 + 2;

            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.15;

            this.color = colors[Math.floor(Math.random() * colors.length)];

            this.shape = Math.random() > 0.5 ? "rect" : "circle";
        }

        update() {
            // MOVE UP
            this.y -= this.vy;

            // slight drift
            this.x += this.vx + Math.sin(this.y * 0.02);

            this.rotation += this.rotationSpeed;

            if (this.y < -30) {
                this.reset();
            }

            if (this.x > w + 20) this.x = -20;
            if (this.x < -20) this.x = w + 20;
        }

        draw() {
            ctx.save();

            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.fillStyle = this.color;

            // glow effect
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 10;

            if (this.shape === "rect") {
                ctx.fillRect(
                    -this.size / 2,
                    -this.size / 2,
                    this.size,
                    this.size * 0.7
                );
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    // LOTS of confetti
    for (let i = 0; i < 300; i++) {
        confetti.push(new Piece());
    }

    function animate() {
        // Matte pink background
        ctx.fillStyle = "#ff8fbe";
        ctx.fillRect(0, 0, w, h);

        confetti.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
})();
</script>

<style>
